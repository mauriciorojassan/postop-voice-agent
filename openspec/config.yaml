schema: spec-driven

context: |
  Project: postop-voice-agent
  Stack: Python + FastAPI, ChromaDB, BGE-M3 embeddings, Groq/Gemini LLM, Kokoro/Piper TTS
  Architecture: RAG over clinical PDFs, voice call via browser, knowledge console, escalation logic
  Language/Locale: Colombian Spanish
  Testing: Greenfield project, test runner not yet configured

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
